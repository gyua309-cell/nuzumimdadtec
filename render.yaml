services:
  - type: web
    name: idham-erp-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w @idham/api
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://gyua309-cell.github.io,http://localhost:5173
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
